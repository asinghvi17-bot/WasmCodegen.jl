name: Pages
on:
  push:
    branches: [main]
  # (a pull request that changes the examples builds the site, and does not publish it)
  pull_request:
    paths: ['examples/**', '.github/workflows/Pages.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        example: [brusselator, images, juliasyntax, lorenz, mtk]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: examples/site/build.sh ${{ matrix.example }} site
      - uses: actions/upload-artifact@v4
        with:
          name: page-${{ matrix.example }}
          path: site/${{ matrix.example }}.html
          if-no-files-found: error
  site:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: page-*
          path: site
          merge-multiple: true
      - run: examples/site/build.sh index site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
